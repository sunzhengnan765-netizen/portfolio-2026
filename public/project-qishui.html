<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汽水音乐 · AI 混合电台 · Ethan</title>
<style>
  html,body{margin:0;padding:0;background:#060606;color:#eaeaea;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .top{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 24px;background:rgba(6,6,6,.85);backdrop-filter:blur(8px);border-bottom:1px solid #1a1a1a}
  .top a{color:rgba(255,255,255,.7);text-decoration:none;font-size:13px;letter-spacing:.05em;display:inline-flex;align-items:center;gap:6px;transition:color .25s}
  .top a:hover{color:#fff}
  .top .label{color:rgba(255,255,255,.4);font-size:12px;justify-self:center;white-space:nowrap}
  .top .open{justify-self:end;color:rgba(255,255,255,.6);text-decoration:none;font-size:12px;padding:4px 10px;border:1px solid rgba(255,255,255,.2);border-radius:4px;transition:all .2s}
  .top .open:hover{color:#fff;border-color:rgba(255,255,255,.5)}
  main{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 18px 60px}
  figure{margin:0;width:100%;max-width:1280px;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.4)}
  figure img{display:block;width:100%;height:auto}
  /* p23 封面 — 静态底图 + demo.webm 动效视频层（沿用 portfolio-html-v3 原版参数） */
  .p23-media{position:relative}
  .p23-media .side-demo{
    position:absolute;
    left:68.1%; top:17.1%;
    height:74.6%; width:auto;
    border-radius:7.5% / 3.41%;
    object-fit:cover;
    box-shadow:0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08);
  }
  /* p33 动效设计 — 原版 slide33 完整实现（双加载 demo + 呼吸文字卡） */
  .p33-media{position:relative}
  .slide33{
    position:relative; width:100%; aspect-ratio:1948/1099; overflow:hidden;
    background-color:#000;
    background-image:linear-gradient(180deg,
      rgba(16,185,129,.51) 0%,
      rgba(16,185,129,.32) 44%,
      rgba(16,185,129,.09) 100%);
    container-type:inline-size;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .s33-title{position:absolute; left:4.4%; top:11.2%; margin:0; font-size:2.913cqw; font-weight:500; letter-spacing:.04em; color:#f4faf7}
  .s33-note{position:absolute; margin:0; top:16.4%; font-size:1.38cqw; color:rgba(232,248,238,.96); transform:translateX(-50%)}
  .s33-note.n1{left:45%}
  .s33-note.n2{left:65%}
  .s33-pill{
    position:absolute; left:3.9%; top:41%; height:6.9%;
    display:inline-flex; align-items:center;
    padding:0 2.1cqw; border-radius:1.2cqw;
    background:#1f4d3f; color:#ffffff; font-size:2.35cqw;
    box-shadow:inset 0 0 0 .08cqw rgba(143,211,191,.35);
  }
  .s33-arrow{position:absolute; left:13.9%; top:49.8%; width:0.85cqw; height:8.6%}
  .s33-arrow path{stroke:rgba(180,240,210,.9)}
  .s33-body{position:absolute; left:4%; top:58.8%; margin:0; font-size:1.38cqw; line-height:1.75; color:#c8e6d8}
  .s33-card{
    position:absolute; left:79.7%; width:16.5%;
    margin:0; padding:1.15cqw 0 1.15cqw 1.3cqw;
    border-left:0.18cqw solid #8fd3bf;
    background:linear-gradient(90deg,rgba(143,211,191,.15),rgba(143,211,191,0) 70%);
    font-size:1.38cqw; line-height:1.8; color:#f0faf4;
  }
  .s33-card.c1{top:33%}
  .s33-card.c2{top:64%}
  .s33-demo{
    position:absolute; z-index:3;
    border-radius:16px; overflow:visible;
    transform:translateX(-50%);
  }
  .s33-demo.d1{left:45%; top:22%; width:auto; height:65%}
  .s33-demo.d2{left:65%; top:24%; width:auto; height:35%}
  .s33-demo video, .s33-demo img{
    display:block; height:100%; width:auto;
    border-radius:16px;
  }
  .p33-media .card{
    position:absolute; left:65%; top:65%; z-index:3;
    transform:translateX(-50%);
    width:max-content;
    max-width:min(20cqw, 320px);
    padding:1.4cqw 1.6cqw 1.3cqw;
    border:.18cqw solid rgba(255,255,255,.18);
    border-radius:1.4cqw;
    background:
      radial-gradient(circle at 50% 14%, rgba(248,216,121,.24), transparent 42%),
      linear-gradient(145deg, rgba(255,255,255,.18), rgba(11,36,9,.86));
    box-shadow:0 1.2cqw 2.6cqw rgba(0,0,0,.32);
    text-align:center;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  }
  .p33-media .title{
    margin:0;
    font-size:1.2cqw; font-weight:900; line-height:1.2; color:#fff;
  }
  .p33-media .breath{
    margin:.5cqw 0 0;
    color:rgba(235,246,231,.72);
    font-size:.78cqw; font-weight:600; line-height:1.4;
    white-space:pre;
  }
  .p33-media .breath span{
    display:inline-block;
    animation:letterBreath 2.87s ease-in-out infinite both;
    animation-delay:calc(var(--i) * .055s);
  }
  @keyframes letterBreath{
    0%   {opacity:0; transform:translateY(12px)}
    14.6%{opacity:1; transform:translateY(0)}
    58.2%{opacity:1; transform:translateY(0)}
    75.6%{opacity:.62; transform:translateY(0)}
    100% {opacity:0; transform:translateY(0)}
  }
  /* p25 业务目标 — 原版纯 CSS 绿渐变页（避免 JPG 压缩带状） */
  .slide25{
    position:relative; width:100%; aspect-ratio:1927/1098; overflow:hidden;
    background-color:#000;
    background-image:linear-gradient(180deg,
      rgba(16,185,129,.51) 0%,
      rgba(16,185,129,.32) 44%,
      rgba(16,185,129,.09) 100%);
    container-type:inline-size;
    color:#fff;
    font-family:'PingFang SC',-apple-system,BlinkMacSystemFont,"Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .s25-content{
    position:absolute; left:50%; top:25.9%;
    transform:translateX(-50%);
    width:48%; display:flex; flex-direction:column;
    align-items:center; gap:2.18cqw; text-align:center;
  }
  .s25-tag{font-size:1.66cqw; font-weight:500; line-height:2.33cqw; color:#fff; margin:0}
  .s25-title{font-size:4.78cqw; font-weight:500; line-height:1.36; color:#fff; margin:0; letter-spacing:.02em}
  .s25-sub{font-size:1.25cqw; font-weight:500; line-height:1.76cqw; color:#fff; margin:0; max-width:66.8%}
  .s25-metric{font-size:1.66cqw; font-weight:400; line-height:2.33cqw; color:rgba(255,255,255,.5); margin:0}
  /* p35 反思与展望 — 原版黑底版本 */
  .p35-media{background:#000}
  footer{padding:30px 24px;display:flex;justify-content:space-between;max-width:1280px;margin:0 auto;font-size:12px;color:rgba(255,255,255,.4)}
  /* 移动端隐藏顶栏 label，只保留 back + open */
  @media (max-width:640px){
    .top{padding:10px 14px}
    .top .label{display:none}
  }
</style>
</head>

    </div></figure>
